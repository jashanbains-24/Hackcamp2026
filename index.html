<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css / src/styles.css.
-->
<html lang="en" data-theme="neighbourgrid">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E6EEF4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#010C14" />
    <title>NeighbourGrid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Keep in sync with --color-background in styles.css / themes.css.
    -->
    <style>
      html { background-color: #E6EEF4; color-scheme: light dark; }
      @media (prefers-color-scheme: dark) { html { background-color: #010C14; } }
      body { margin: 0; font-family: Manrope, ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
